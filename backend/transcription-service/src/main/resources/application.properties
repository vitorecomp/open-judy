quarkus.application.name=transcription-service
quarkus.http.port=8083

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:judy_user}
quarkus.datasource.password=${DB_PASSWORD:judy_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:open_judy_db}

# Google Gemini API Settings
gemini.api.key=${GEMINI_API_KEY:mock_or_set_real_gemini_key}
gemini.model.name=${GEMINI_MODEL:gemini-2.0-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

# Kafka Configuration
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Incoming Channel: Audio Uploads
mp.messaging.incoming.audio-uploaded-in.connector=smallrye-kafka
mp.messaging.incoming.audio-uploaded-in.topic=judy.audio.uploaded
mp.messaging.incoming.audio-uploaded-in.value.deserializer=org.openjudy.transcription.consumer.AudioUploadedDeserializer
mp.messaging.incoming.audio-uploaded-in.group.id=transcription-service-group
mp.messaging.incoming.audio-uploaded-in.auto.offset.reset=earliest

# Outgoing Channel: Transcription Completed
mp.messaging.outgoing.transcription-completed.connector=smallrye-kafka
mp.messaging.outgoing.transcription-completed.topic=judy.transcription.completed
mp.messaging.outgoing.transcription-completed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Health
quarkus.smallrye-health.root-path=/q/health
quarkus.swagger-ui.always-include=true
