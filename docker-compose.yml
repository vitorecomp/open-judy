services:
  # =================================================================
  # 1. INFRASTRUCTURE SERVICES
  # =================================================================

  # AlloyDB-compatible PostgreSQL with pgvector extension
  alloydb-local:
    image: docker.io/pgvector/pgvector:pg16
    container_name: open-judy-alloydb
    environment:
      POSTGRES_DB: open_judy_db
      POSTGRES_USER: judy_user
      POSTGRES_PASSWORD: judy_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alloydb_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: "pg_isready -U judy_user -d open_judy_db"
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka with KRaft (no ZooKeeper required)
  kafka:
    image: docker.io/confluentinc/cp-kafka:7.6.0
    container_name: open-judy-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: "kafka-broker-api-versions --bootstrap-server localhost:9092"
      interval: 10s
      timeout: 10s
      retries: 5

  # MinIO (S3-compatible Object Storage for Court Audio/Video)
  minio:
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: open-judy-minio
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: judy_minio_admin
      MINIO_ROOT_PASSWORD: judy_minio_password
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/open-judy-audio && exec minio server /data --console-address :9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: "wget -q --spider http://localhost:9000/minio/health/live"
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak IAM & OIDC Authentication Server
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: open-judy-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro,z
    healthcheck:
      test: "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: 127.0.0.1:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 6

  # RabbitMQ Message Broker & Management Console
  rabbitmq:
    image: docker.io/rabbitmq:3.13-management
    container_name: open-judy-rabbitmq
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R rabbitmq:rabbitmq /var/lib/rabbitmq 2>/dev/null || true; exec rabbitmq-server"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: judy_user
      RABBITMQ_DEFAULT_PASS: judy_password
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ERLANG_COOKIE: "open_judy_secret_cookie_12345"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: "rabbitmq-diagnostics -q ping"
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch Full-Text Search Engine
  elasticsearch:
    image: docker.io/elasticsearch:8.13.0
    container_name: open-judy-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: "curl -f http://localhost:9200/_cluster/health"
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================================================
  # 2. BACKEND MICROSERVICES (QUARKUS DEV MODE WITH HOT RELOAD)
  # =================================================================

  # Legal Lawsuits & Case Documents Service
  case-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-case-service
    ports:
      - "8081:8081"
      - "5006:5005"
    environment:
      SERVICE_NAME: case-service
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: open-judy
      KEYCLOAK_CLIENT_ID: open-judy-backend
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8081"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
    healthcheck:
      test: "curl -f http://localhost:8081/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # Gemini Audio Transcription & Diarization Service
  transcription-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-transcription-service
    ports:
      - "8083:8083"
      - "5007:5005"
    environment:
      SERVICE_NAME: transcription-service
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: open-judy
      KEYCLOAK_CLIENT_ID: open-judy-backend
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: judy_user
      RABBITMQ_PASSWORD: judy_password
      RABBITMQ_VHOST: /
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_or_set_real_gemini_key}
      GEMINI_MODEL: gemini-2.0-flash
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8083"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
      - kafka
      - rabbitmq
      - keycloak
    healthcheck:
      test: "curl -f http://localhost:8083/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # User Management Service (Keycloak OIDC Auth & JIT Provisioning)
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-user-service
    ports:
      - "8085:8085"
      - "5009:5005"
    environment:
      SERVICE_NAME: user-service
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: open-judy
      KEYCLOAK_CLIENT_ID: open-judy-backend
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8085"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
      - kafka
      - keycloak
    healthcheck:
      test: "curl -f http://localhost:8085/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # System Configuration Service (Prompts, Models, Dashboards, Notification Types)
  config-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-config-service
    ports:
      - "8086:8086"
      - "5011:5005"
    environment:
      SERVICE_NAME: config-service
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: open-judy
      KEYCLOAK_CLIENT_ID: open-judy-backend
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8086"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
      - kafka
      - keycloak
    healthcheck:
      test: "curl -f http://localhost:8086/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # Real-Time Judicial Notification Service (RabbitMQ, SSE, DB)
  notification-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-notification-service
    ports:
      - "8087:8087"
      - "5013:5005"
    environment:
      SERVICE_NAME: notification-service
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: judy_user
      RABBITMQ_PASSWORD: judy_password
      RABBITMQ_VHOST: /
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: open-judy
      KEYCLOAK_CLIENT_ID: open-judy-backend
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8087"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
      - kafka
      - rabbitmq
    healthcheck:
      test: "curl -f http://localhost:8087/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # Judicial Notebook & Open Multi-Context Chat Service
  notebook-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-notebook-service
    ports:
      - "8090:8090"
      - "5015:5005"
    environment:
      SERVICE_NAME: notebook-service
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      CASE_SERVICE_URL: http://case-service:8081
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_or_set_real_gemini_key}
      GEMINI_MODEL: gemini-2.0-flash
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: open-judy
      KEYCLOAK_CLIENT_ID: open-judy-backend
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8090"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
      - case-service
      - transcription-service
    healthcheck:
      test: "curl -f http://localhost:8090/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # Gemini Enterprise Agent Garden Service (StreamAssist Gateway, Enterprise Agents)
  agent-garden:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-agent-garden
    ports:
      - "8088:8088"
      - "5014:5005"
    environment:
      SERVICE_NAME: agent-garden
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-open-judy-cloud}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      GCP_ENDPOINT_LOCATION: ${GCP_ENDPOINT_LOCATION:-global}
      GCP_APP_ID: ${GCP_APP_ID:-judy-legal-agents}
      GCP_ASSISTANT_ID: ${GCP_ASSISTANT_ID:-default_assistant}
      GCP_API_KEY: ${GCP_API_KEY:-}
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8088"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - alloydb-local
    healthcheck:
      test: "curl -f http://localhost:8088/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # Unified Elasticsearch Full-Text Indexer & Search Service
  indexer-service:
    build:
      context: .
      dockerfile: services/Dockerfile.dev
    container_name: open-judy-indexer-service
    ports:
      - "8089:8089"
      - "5016:5005"
    environment:
      SERVICE_NAME: indexer-service
      ELASTICSEARCH_HOSTS: elasticsearch:9200
      ELASTICSEARCH_PROTOCOL: http
      CASE_SERVICE_URL: http://case-service:8081
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8083
      AGENT_GARDEN_SERVICE_URL: http://agent-garden:8088
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8089"
    volumes:
      - ./services:/workspace/services:z
      - maven_cache:/root/.m2
    depends_on:
      - elasticsearch
      - alloydb-local
    healthcheck:
      test: "curl -f http://localhost:8089/q/health/ready"
      interval: 15s
      timeout: 5s
      retries: 5

  # =================================================================
  # 3. ASYNC PIPELINES & WORKERS (PYTHON RESILIENT CONSUMERS)
  # =================================================================

  # Multimodal Gemini Transcription & Diarization Pipeline
  transcription-pipeline:
    build:
      context: .
      dockerfile: pipelines/transcription-pipeline/Dockerfile
    container_name: open-judy-transcription-pipeline
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: judy_user
      RABBITMQ_PASSWORD: judy_password
      RABBITMQ_VHOST: /
      EXCHANGE_NAME: judy.direct
      QUEUE_NAME: judy.transcription.jobs
      ROUTING_KEY: transcription.job
      DB_HOST: alloydb-local
      DB_PORT: "5432"
      DB_NAME: open_judy_db
      DB_USER: judy_user
      DB_PASSWORD: judy_password
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_or_set_real_gemini_key}
      GEMINI_MODEL: gemini-2.0-flash
      MAX_RETRIES: "3"
      RETRY_BACKOFF_SECONDS: "5"
    volumes:
      - ./pipelines/transcription-pipeline:/app:z
    depends_on:
      - rabbitmq
      - alloydb-local
      - minio

  # =================================================================
  # 4. FRONTEND PORTAL (NEXT.JS 15 DEV MODE WITH FAST REFRESH)
  # =================================================================
  open-judy-ui:
    build:
      context: ./frontend/open-judy-ui
      dockerfile: Dockerfile.dev
    container_name: open-judy-ui
    ports:
      - "3000:3000"
    environment:
      CASE_SERVICE_URL: http://case-service:8081
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8083
      USER_SERVICE_URL: http://user-service:8085
      CONFIG_SERVICE_URL: http://config-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      AGENT_GARDEN_SERVICE_URL: http://agent-garden:8088
      INDEXER_SERVICE_URL: http://indexer-service:8089
      NOTEBOOK_SERVICE_URL: http://notebook-service:8090
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: open-judy
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: open-judy-ui
      KEYCLOAK_URL: http://keycloak:8080
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend/open-judy-ui:/app:z
    depends_on:
      - case-service
      - transcription-service
      - user-service
      - config-service
      - notification-service
      - agent-garden
      - indexer-service
      - notebook-service
      - keycloak

networks:
  default:
    name: open-judy-network

volumes:
  alloydb_data:
  kafka_data:
  minio_data:
  rabbitmq_data:
  elasticsearch_data:
  maven_cache:
