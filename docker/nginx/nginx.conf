worker_processes 4;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # LOGGING & OBSERVABILITY (JSON STRUCTURED ACCESS LOG WITH UPSTREAM METRICS)
    # =========================================================================
    log_format main_json escape=json
        '{'
            '"time_local":"$time_local",'
            '"request_id":"$req_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log warn;

    # Propagate incoming X-Request-ID or synthesize one from Nginx $request_id
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # WebSocket / SSE Connection header upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # =========================================================================
    # PERFORMANCE, ZERO-COPY IO & GZIP COMPRESSION
    # =========================================================================
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # Support multi-gigabyte 10-hour courtroom video uploads
    client_max_body_size 5G;
    client_body_buffer_size 16M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # =========================================================================
    # UPSTREAM LOAD BALANCER POOLS (LEAST_CONN + KEEPALIVE + PASSIVE HEALTH)
    # =========================================================================

    upstream frontend_ui_backend {
        least_conn;
        server open-judy-ui:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream case_service_backend {
        least_conn;
        server case-service:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Media & video ingestion pool (routed to case-service:8081 in dev cluster;
    # ready for dedicated ingestion-service:8082 horizontal replicas)
    upstream ingestion_service_backend {
        least_conn;
        server case-service:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream transcription_service_backend {
        least_conn;
        server transcription-service:8083 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Full-text & semantic search pool (backed by indexer-service:8089)
    upstream search_service_backend {
        least_conn;
        server indexer-service:8089 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Gemini Enterprise Agent Garden pool (backed by agent-garden:8088)
    upstream agent_service_backend {
        least_conn;
        server agent-garden:8088 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream config_service_backend {
        least_conn;
        server config-service:8086 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream user_service_backend {
        least_conn;
        server user-service:8085 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream notification_service_backend {
        least_conn;
        server notification-service:8087 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream indexer_service_backend {
        least_conn;
        server indexer-service:8089 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream notebook_service_backend {
        least_conn;
        server notebook-service:8090 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Task & Audit pool with automatic failover to case-service backup replica
    upstream task_audit_service_backend {
        least_conn;
        server task-audit-service:8091 max_fails=3 fail_timeout=10s;
        server case-service:8081 backup;
        keepalive 32;
    }

    upstream keycloak_backend {
        least_conn;
        server keycloak:8080 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # =========================================================================
    # PRODUCTION-GRADE LOAD BALANCER & API GATEWAY SERVER
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Global Load Balancer Trace Headers
        add_header X-Load-Balancer "open-judy-nginx-lb" always;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Request-ID $req_id always;

        # Standard Upstream Proxy Defaults
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $req_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # ---------------------------------------------------------------------
        # 1. LOAD BALANCER HEALTH & TELEMETRY ENDPOINTS
        # ---------------------------------------------------------------------
        location = /lb-health {
            access_log off;
            default_type application/json;
            add_header X-Load-Balancer "open-judy-nginx-lb" always;
            return 200 '{"status":"UP","loadBalancer":"open-judy-nginx-lb","environment":"dev-production-lb"}';
        }

        location = /nginx_status {
            stub_status;
            access_log off;
            add_header X-Load-Balancer "open-judy-nginx-lb" always;
        }

        # ---------------------------------------------------------------------
        # 2. CASE & HEARING MANAGEMENT + LARGE VIDEO INGESTION
        # ---------------------------------------------------------------------
        location /api/v1/cases {
            proxy_pass http://case_service_backend;
        }

        location /api/v1/hearings {
            client_max_body_size 5G;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_force_ranges on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://case_service_backend;
        }

        location /api/v1/ingest {
            client_max_body_size 5G;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_force_ranges on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://ingestion_service_backend;
        }

        location /api/v1/media {
            client_max_body_size 5G;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_force_ranges on;
            proxy_read_timeout 600s;
            proxy_pass http://ingestion_service_backend;
        }

        # ---------------------------------------------------------------------
        # 3. TRANSCRIPTION, GEMINI AI SUMMARIES & LEGAL ANALYSIS
        # ---------------------------------------------------------------------
        location /api/v1/transcriptions {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://transcription_service_backend;
        }

        location /api/v1/ai {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://transcription_service_backend;
        }

        location /api/v1/summaries {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://transcription_service_backend;
        }

        # ---------------------------------------------------------------------
        # 4. ELASTICSEARCH INDEXER & FULL-TEXT SEARCH
        # ---------------------------------------------------------------------
        location /api/v1/indexer {
            proxy_pass http://indexer_service_backend;
        }

        location = /api/v1/search {
            rewrite ^/api/v1/search$ /api/v1/indexer/search break;
            proxy_pass http://search_service_backend;
        }

        location /api/v1/search/ {
            rewrite ^/api/v1/search/(.*)$ /api/v1/indexer/search/$1 break;
            proxy_pass http://search_service_backend;
        }

        # ---------------------------------------------------------------------
        # 5. GEMINI ENTERPRISE AGENT GARDEN
        # ---------------------------------------------------------------------
        location /api/v1/agent-garden {
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_pass http://agent_service_backend;
        }

        location = /api/v1/agents {
            rewrite ^/api/v1/agents$ /api/v1/agent-garden/agents break;
            proxy_read_timeout 300s;
            proxy_pass http://agent_service_backend;
        }

        location /api/v1/agents/ {
            rewrite ^/api/v1/agents/(.*)$ /api/v1/agent-garden/$1 break;
            proxy_read_timeout 300s;
            proxy_pass http://agent_service_backend;
        }

        # ---------------------------------------------------------------------
        # 6. SYSTEM CONFIGURATION & PROMPT TEMPLATES
        # ---------------------------------------------------------------------
        location /api/v1/config {
            proxy_pass http://config_service_backend;
        }

        location = /api/v1/prompts {
            rewrite ^/api/v1/prompts$ /api/v1/config/prompts break;
            proxy_pass http://config_service_backend;
        }

        location /api/v1/prompts/ {
            rewrite ^/api/v1/prompts/(.*)$ /api/v1/config/prompts/$1 break;
            proxy_pass http://config_service_backend;
        }

        # ---------------------------------------------------------------------
        # 7. USER MANAGEMENT, RBAC & AUTHENTICATION
        # ---------------------------------------------------------------------
        location /api/v1/users {
            proxy_pass http://user_service_backend;
        }

        location /api/v1/auth {
            proxy_pass http://user_service_backend;
        }

        location /api/v1/system {
            proxy_pass http://user_service_backend;
        }

        # ---------------------------------------------------------------------
        # 8. REAL-TIME NOTIFICATIONS (SSE STREAMING)
        # ---------------------------------------------------------------------
        location /api/v1/notifications {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_pass http://notification_service_backend;
        }

        # ---------------------------------------------------------------------
        # 9. JUDICIAL NOTEBOOKS & MULTI-CONTEXT RAG CHAT
        # ---------------------------------------------------------------------
        location /api/v1/notebooks {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://notebook_service_backend;
        }

        # ---------------------------------------------------------------------
        # 10. ASYNC RABBITMQ TASK REGISTRY & AUDIT TRAIL
        # ---------------------------------------------------------------------
        location /api/v1/tasks {
            proxy_pass http://task_audit_service_backend;
        }

        location /api/v1/audit {
            proxy_pass http://task_audit_service_backend;
        }

        # ---------------------------------------------------------------------
        # 11. KEYCLOAK OIDC REALMS & ASSETS
        # ---------------------------------------------------------------------
        location /realms/ {
            proxy_pass http://keycloak_backend;
        }

        location /resources/ {
            proxy_pass http://keycloak_backend;
        }

        # ---------------------------------------------------------------------
        # 12. ZERO-COPY BYTE-RANGE VIDEO STREAMING (/media/hearings/*)
        # ---------------------------------------------------------------------
        location /media/ {
            root /usr/share/nginx/html;
            sendfile on;
            tcp_nopush on;
            output_buffers 2 1m;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Load-Balancer "open-judy-nginx-lb" always;
            try_files $uri @frontend_media;
        }

        location @frontend_media {
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_force_ranges on;
            proxy_read_timeout 600s;
            proxy_pass http://frontend_ui_backend;
        }

        # ---------------------------------------------------------------------
        # 13. NEXT.JS WEBPACK HMR WEBSOCKET & FRONTEND PORTAL
        # ---------------------------------------------------------------------
        location /_next/webpack-hmr {
            proxy_pass http://frontend_ui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://frontend_ui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
