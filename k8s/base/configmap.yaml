apiVersion: v1
kind: ConfigMap
metadata:
  name: open-judy-config
  labels:
    app.kubernetes.io/part-of: open-judy
data:
  DB_HOST: "alloydb-proxy-service"
  DB_PORT: "5432"
  DB_NAME: "open_judy_db"
  DB_USER: "judy_user"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  ELASTICSEARCH_HOSTS: "elasticsearch:9200"
  ELASTICSEARCH_PROTOCOL: "http"
  GEMINI_MODEL: "gemini-2.0-flash"
  GEMINI_EMBEDDING_MODEL: "text-embedding-004"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "open-judy-audio"
  AWS_REGION: "us-east-1"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "open-judy"
  KEYCLOAK_CLIENT_ID: "open-judy-backend"
  NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080"
  NEXT_PUBLIC_KEYCLOAK_REALM: "open-judy"
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "open-judy-ui"
  CASE_SERVICE_URL: "http://case-service:8081"
  TRANSCRIPTION_SERVICE_URL: "http://transcription-service:8083"
  USER_SERVICE_URL: "http://user-service:8085"
  CONFIG_SERVICE_URL: "http://config-service:8086"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8087"
  AGENT_GARDEN_SERVICE_URL: "http://agent-garden:8088"
  INDEXER_SERVICE_URL: "http://indexer-service:8089"
  NOTEBOOK_SERVICE_URL: "http://notebook-service:8090"
  GCP_PROJECT_ID: "open-judy-cloud"
  GCP_LOCATION: "global"
  GCP_ENDPOINT_LOCATION: "global"
  GCP_APP_ID: "judy-legal-agents"
  GCP_ASSISTANT_ID: "default_assistant"
