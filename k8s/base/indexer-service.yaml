apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-service
  labels:
    app.kubernetes.io/name: indexer-service
    app.kubernetes.io/part-of: open-judy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: indexer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer-service
        app.kubernetes.io/part-of: open-judy
    spec:
      containers:
        - name: indexer-service
          image: open-judy/indexer-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
              name: http
          envFrom:
            - configMapRef:
                name: open-judy-config
            - secretRef:
                name: open-judy-secrets
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: indexer-service
  labels:
    app.kubernetes.io/name: indexer-service
    app.kubernetes.io/part-of: open-judy
spec:
  ports:
    - port: 8089
      targetPort: 8089
      name: http
  selector:
    app.kubernetes.io/name: indexer-service
