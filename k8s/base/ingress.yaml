apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-judy-ingress
  labels:
    app.kubernetes.io/part-of: open-judy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/transcriptions
            pathType: Prefix
            backend:
              service:
                name: transcription-service
                port:
                  number: 8083
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8085
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-judy-ui
                port:
                  number: 80
