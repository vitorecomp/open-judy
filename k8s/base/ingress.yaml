apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-judy-ingress
  labels:
    app.kubernetes.io/part-of: open-judy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/cases
            pathType: Prefix
            backend:
              service:
                name: case-service
                port:
                  number: 8081
          - path: /api/v1/hearings
            pathType: Prefix
            backend:
              service:
                name: case-service
                port:
                  number: 8081
          - path: /api/v1/transcriptions
            pathType: Prefix
            backend:
              service:
                name: transcription-service
                port:
                  number: 8083
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8085
          - path: /api/v1/system
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8085
          - path: /api/v1/config
            pathType: Prefix
            backend:
              service:
                name: config-service
                port:
                  number: 8086
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8087
          - path: /api/v1/agent-garden
            pathType: Prefix
            backend:
              service:
                name: agent-garden
                port:
                  number: 8088
          - path: /api/v1/indexer
            pathType: Prefix
            backend:
              service:
                name: indexer-service
                port:
                  number: 8089
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: indexer-service
                port:
                  number: 8089
          - path: /api/v1/notebooks
            pathType: Prefix
            backend:
              service:
                name: notebook-service
                port:
                  number: 8090
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-judy-ui
                port:
                  number: 80
