apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-service
  labels:
    app.kubernetes.io/name: notebook-service
    app.kubernetes.io/part-of: open-judy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-service
        app.kubernetes.io/part-of: open-judy
    spec:
      containers:
        - name: notebook-service
          image: open-judy/notebook-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: open-judy-config
            - secretRef:
                name: open-judy-secrets
          env:
            - name: TRANSCRIPTION_SERVICE_URL
              value: "http://transcription-service:8083"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8087"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-service
  labels:
    app.kubernetes.io/name: notebook-service
    app.kubernetes.io/part-of: open-judy
spec:
  ports:
    - port: 8090
      targetPort: 8090
      name: http
  selector:
    app.kubernetes.io/name: notebook-service
