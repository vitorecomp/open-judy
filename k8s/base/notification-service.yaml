apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: open-judy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: open-judy
    spec:
      containers:
        - name: notification-service
          image: open-judy/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
              name: http
          envFrom:
            - configMapRef:
                name: open-judy-config
            - secretRef:
                name: open-judy-secrets
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: open-judy-secrets
                  key: RABBITMQ_USER
                  optional: true
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-judy-secrets
                  key: RABBITMQ_PASSWORD
                  optional: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: open-judy
spec:
  ports:
    - port: 8087
      targetPort: 8087
      name: http
  selector:
    app.kubernetes.io/name: notification-service
