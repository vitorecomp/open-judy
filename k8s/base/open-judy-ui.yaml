apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-judy-ui
  labels:
    app.kubernetes.io/name: open-judy-ui
    app.kubernetes.io/part-of: open-judy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: open-judy-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-judy-ui
    spec:
      containers:
        - name: open-judy-ui
          image: open-judy/open-judy-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: CASE_SERVICE_URL
              value: "http://case-service:8081"
            - name: MEDIA_SERVICE_URL
              value: "http://media-service:8082"
            - name: TRANSCRIPTION_SERVICE_URL
              value: "http://transcription-service:8083"
            - name: AI_SERVICE_URL
              value: "http://judy-ai-service:8084"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: open-judy-ui
  labels:
    app.kubernetes.io/name: open-judy-ui
    app.kubernetes.io/part-of: open-judy
spec:
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: open-judy-ui
