apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-judy-ui
  labels:
    app.kubernetes.io/name: open-judy-ui
    app.kubernetes.io/part-of: open-judy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: open-judy-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-judy-ui
        app.kubernetes.io/part-of: open-judy
    spec:
      containers:
        - name: open-judy-ui
          image: open-judy/open-judy-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: open-judy-config
          env:
            - name: CASE_SERVICE_URL
              value: "http://case-service:8081"
            - name: TRANSCRIPTION_SERVICE_URL
              value: "http://transcription-service:8083"
            - name: USER_SERVICE_URL
              value: "http://user-service:8085"
            - name: CONFIG_SERVICE_URL
              value: "http://config-service:8086"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8087"
            - name: AGENT_GARDEN_SERVICE_URL
              value: "http://agent-garden:8088"
            - name: INDEXER_SERVICE_URL
              value: "http://indexer-service:8089"
            - name: NOTEBOOK_SERVICE_URL
              value: "http://notebook-service:8090"
            - name: KEYCLOAK_URL
              value: "http://keycloak:8080"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: open-judy-ui
  labels:
    app.kubernetes.io/name: open-judy-ui
    app.kubernetes.io/part-of: open-judy
spec:
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: open-judy-ui
