quarkus.application.name=agent-garden
quarkus.http.port=8088
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
%test.quarkus.http.test-port=0

# Google Cloud Discovery Engine / Gemini Enterprise Configuration
gcp.project-id=${GCP_PROJECT_ID:open-judy-cloud}
gcp.location=${GCP_LOCATION:global}
gcp.endpoint-location=${GCP_ENDPOINT_LOCATION:global}
gcp.app-id=${GCP_APP_ID:judy-legal-agents}
gcp.assistant-id=${GCP_ASSISTANT_ID:default_assistant}
gcp.api-key=${GCP_API_KEY:}
gcp.service-account-key-path=${GCP_SA_KEY_PATH:}

# Discovery Engine StreamAssist REST API Base
discoveryengine.api.base-url=https://${gcp.endpoint-location}-discoveryengine.googleapis.com

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Health
quarkus.smallrye-health.root-path=/q/health
