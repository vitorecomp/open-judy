quarkus.application.name=config-service
quarkus.http.port=8086
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
%test.quarkus.http.test-port=0

# Database Configuration (AlloyDB / PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:judy_user}
quarkus.datasource.password=${DB_PASSWORD:judy_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:open_judy_db}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.table=flyway_config_history
quarkus.flyway.schemas=public

# Kafka Configuration
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
quarkus.kafka.health.enabled=false

# Outgoing Kafka Channels for Configuration Changes
mp.messaging.outgoing.config-events.connector=smallrye-kafka
mp.messaging.outgoing.config-events.topic=judy.config.events
mp.messaging.outgoing.config-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.config-events.health-enabled=false
mp.messaging.outgoing.config-events.waitForWriteCompletion=false
mp.messaging.outgoing.config-events.max.block.ms=100
mp.messaging.outgoing.config-events.request.timeout.ms=200
mp.messaging.outgoing.config-events.delivery.timeout.ms=300
mp.messaging.outgoing.config-events.retries=0

# Health & OpenAPI / Swagger UI
quarkus.smallrye-health.root-path=/q/health
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Keycloak IAM & OIDC Configuration
keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:open-judy}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:open-judy-backend}
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:open-judy}
