quarkus.application.name=indexer-service
quarkus.http.port=8089
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Elasticsearch Configuration
quarkus.elasticsearch.hosts=${ELASTICSEARCH_HOSTS:localhost:9200}
quarkus.elasticsearch.protocol=${ELASTICSEARCH_PROTOCOL:http}
quarkus.elasticsearch.connection-timeout=5s
quarkus.elasticsearch.socket-timeout=30s
quarkus.elasticsearch.max-connections=20
quarkus.elasticsearch.max-connections-per-route=10

# Services Integration URLs (for reindexing crawling)
case-service.url=${CASE_SERVICE_URL:http://localhost:8081}
transcription-service.url=${TRANSCRIPTION_SERVICE_URL:http://localhost:8083}
agent-garden.url=${AGENT_GARDEN_SERVICE_URL:http://localhost:8088}

# OpenAPI & Health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-health.root-path=/q/health
