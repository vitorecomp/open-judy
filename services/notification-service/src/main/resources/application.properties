quarkus.application.name=notification-service
quarkus.http.port=8087
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
%test.quarkus.http.test-port=0

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:judy_user}
quarkus.datasource.password=${DB_PASSWORD:judy_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:open_judy_db}

# Flyway Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.table=flyway_notification_history
quarkus.flyway.schemas=public

# RabbitMQ AMQP Configuration
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USER:judy_user}
rabbitmq.password=${RABBITMQ_PASSWORD:judy_password}
rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
rabbitmq.exchange=${RABBITMQ_EXCHANGE:judy.direct}
rabbitmq.queue=${RABBITMQ_QUEUE:judy.transcription.completed}
rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:transcription.completed}

# Kafka Configuration (Optional/Fallback)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
quarkus.kafka.health.enabled=false

# Health & OpenAPI
quarkus.smallrye-health.root-path=/q/health
quarkus.swagger-ui.always-include=true
