# =========================================================================
# Open Judy :: RabbitMQ Async Task Registry & Audit Service (:8091)
# =========================================================================
quarkus.application.name=open-judy-task-audit-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${QUARKUS_HTTP_PORT:8091}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-user-email,x-user-role,x-user-name

# PostgreSQL / AlloyDB Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:judy_user}
quarkus.datasource.password=${DB_PASSWORD:judy_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:open_judy_db}
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.openjudy".level=INFO
