quarkus.application.name=user-service
quarkus.http.port=8085

# Database Configuration (AlloyDB / PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:judy_user}
quarkus.datasource.password=${DB_PASSWORD:judy_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:open_judy_db}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.table=flyway_user_history
quarkus.flyway.schemas=public

# Kafka Configuration
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing Kafka Channels
mp.messaging.outgoing.user-events.connector=smallrye-kafka
mp.messaging.outgoing.user-events.topic=judy.user.events
mp.messaging.outgoing.user-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Health & OpenAPI / Swagger UI
quarkus.smallrye-health.root-path=/q/health
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Keycloak IAM & OIDC Configuration
keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:open-judy}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:open-judy-backend}
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:open-judy}
